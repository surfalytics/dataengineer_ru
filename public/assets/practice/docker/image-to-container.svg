<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="Путь от Dockerfile к образу и контейнерам через реестр"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs><rect x="1" y="1" width="958" height="378" rx="14" fill="#ffffff" stroke="#dee2e6" stroke-width="2"/><text x="480" y="42" font-size="24" fill="#1e1e1e" text-anchor="middle" font-weight="bold" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">От Dockerfile до работающего контейнера</text><rect x="330" y="70" width="300" height="70" rx="8" fill="#d0bfff" stroke="#7048e8" stroke-width="2"/><text x="480.0" y="110.6" font-size="16" fill="#1e1e1e" text-anchor="middle" font-weight="bold" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">Реестр (Docker Hub, GHCR, ECR)</text><rect x="40" y="220" width="190" height="80" rx="8" fill="#ffec99" stroke="#f08c00" stroke-width="2"/><text x="135.0" y="266.3" font-size="18" fill="#1e1e1e" text-anchor="middle" font-weight="bold" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">Dockerfile</text><text x="135" y="322" font-size="14" fill="#495057" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">рецепт: что внутри</text><rect x="380" y="220" width="200" height="80" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text x="480.0" y="266.3" font-size="18" fill="#1e1e1e" text-anchor="middle" font-weight="bold" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">Образ (image)</text><text x="480" y="322" font-size="14" fill="#495057" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">готовый шаблон, только чтение</text><rect x="740" y="190" width="180" height="44" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text x="830.0" y="217.6" font-size="16" fill="#1e1e1e" text-anchor="middle" font-weight="bold" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">Контейнер 1</text><rect x="740" y="246" width="180" height="44" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text x="830.0" y="273.6" font-size="16" fill="#1e1e1e" text-anchor="middle" font-weight="bold" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">Контейнер 2</text><rect x="740" y="302" width="180" height="44" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text x="830.0" y="329.6" font-size="16" fill="#1e1e1e" text-anchor="middle" font-weight="bold" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">Контейнер 3</text><line x1="232" y1="260" x2="376" y2="260" stroke="#495057" stroke-width="3" marker-end="url(#a)"/><text x="304" y="246" font-size="15" fill="#1971c2" text-anchor="middle" font-weight="bold" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">docker build</text><line x1="582" y1="250" x2="736" y2="212" stroke="#495057" stroke-width="3" marker-end="url(#a)"/><line x1="582" y1="260" x2="736" y2="268" stroke="#495057" stroke-width="3" marker-end="url(#a)"/><line x1="582" y1="270" x2="736" y2="324" stroke="#495057" stroke-width="3" marker-end="url(#a)"/><text x="650" y="190" font-size="15" fill="#2b8a3e" text-anchor="middle" font-weight="bold" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">docker run</text><line x1="450" y1="216" x2="450" y2="144" stroke="#495057" stroke-width="3" marker-end="url(#a)"/><text x="402" y="186" font-size="15" fill="#7048e8" text-anchor="end" font-weight="bold" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">docker push</text><line x1="510" y1="144" x2="510" y2="216" stroke="#495057" stroke-width="3" marker-end="url(#a)"/><text x="558" y="186" font-size="15" fill="#7048e8" text-anchor="start" font-weight="bold" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">docker pull</text></svg>